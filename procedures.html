<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pain Procedures - PainMed Pro</title>

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #f1f5fb;
            color: #26344d;
        }

        .header {
            background: #294a78;
            color: white;
            padding: 24px 20px;
        }

        .header h1 {
            margin: 0;
            font-size: 28px;
        }

        .header p {
            margin: 6px 0 0;
            opacity: 0.85;
        }

        .container { padding: 24px 20px; }

        .search {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 14px;
            font-size: 16px;
            margin-bottom: 24px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .section-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 14px;
            color: #66758d;
            text-transform: uppercase;
        }

        .procedure-card {
            background: white;
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .procedure-info {
            flex: 1;
            min-width: 0;
        }

        .procedure-info.clickable { cursor: pointer; }

        .procedure-card h3 {
            margin: 0 0 6px;
            font-size: 18px;
        }

        .procedure-card p {
            margin: 0;
            color: #718096;
            font-size: 14px;
        }

        .youtube-button {
            flex: 0 0 auto;
            min-width: 76px;
            height: 42px;
            padding: 0 10px;
            border-radius: 12px;
            background: #ff0000;
            color: white;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-size: 12px;
            font-weight: 700;
            box-shadow: 0 2px 6px rgba(0,0,0,0.12);
        }

        .youtube-icon { font-size: 13px; }

        .back {
            display: inline-block;
            margin-bottom: 18px;
            color: white;
            text-decoration: none;
            font-weight: 600;
        }

        #no-results {
            display: none;
            text-align: center;
            color: #718096;
            padding: 30px 10px;
        }

        @media (max-width: 480px) {
            .procedure-card { padding: 14px; }
            .youtube-button { min-width: 44px; width: 44px; padding: 0; }
            .youtube-label { display: none; }
        }
    </style>
</head>

<body>

    <div class="header">
        <a class="back" href="index.html">← Back to Resources</a>
        <h1>🩺 Pain Procedures</h1>
        <p>Important interventional pain procedures</p>
    </div>

    <div class="container">

        <input
            type="search"
            id="search"
            class="search"
            placeholder="Search procedures..."
            aria-label="Search pain procedures"
        >

        <div class="section-title">Procedures</div>

        <div id="procedure-list"></div>
        <div id="no-results">No procedures found.</div>

    </div>

    <script src="procedures.js"></script>

</body>
</html>
